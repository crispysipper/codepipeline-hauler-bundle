# Hauler bundle inventory (ported from rke2-bundle-builder).
# rewrite: destination path under TARGET_REGISTRY_BASE (ECR), and the path
# Hauler serves on the bootstrap registry — keep hauler/<image-name>:<tag>.
inventory:
